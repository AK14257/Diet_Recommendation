name: ubereatsdriver
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  sizer: ^2.0.15
  country_picker: ^2.0.25
  font_awesome_flutter: ^10.7.0
  pin_code_fields: ^8.0.1
  persistent_bottom_nav_bar_v2: ^5.2.3
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  page_transition: ^2.1.0
  provider: ^6.1.2
  image_picker: ^1.1.1
  geolocator: ^11.0.0
  flutter_geofire: ^2.0.3
  cloud_firestore: ^4.17.2
  uuid: ^4.1.0
  firebase_storage: ^11.7.4
  carousel_slider: ^4.2.1
  flutter_styled_toast: ^2.2.1
  google_maps_flutter: ^2.7.0
  firebase_database: ^10.5.7
  flutter_swipe_button: ^2.1.3
  firebase_messaging: ^14.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/splashScreenImage/

  fonts:
    - family: UberMoveMedium
      fonts:
        - asset: assets/fonts/UberMoveMedium.otf

    - family: UberMoveBold
      fonts:
        - asset: assets/fonts/UberMoveBold.otf